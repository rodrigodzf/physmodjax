[project]
name="physmodjax"
version = "0.0.1"
description = "Physical modelling using neural networks with JAX"
readme = "README.md"
requires-python=">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.0",
    "nvidia-cublas-cu12 >= 12.6.4.1",
    "nvidia-cusolver-cu12 >= 11.7.1.2",
    "jax[cuda12]>=0.6",
    "flax>=0.10.2",
    "diffrax>=0.6.0",
    "optax>=0.2.4",
    "orbax-checkpoint==0.11.10",
    "wandb==0.18.7",
    "matplotlib==3.10",
    "scipy>=1.15.0",
    "scikit-fem==10.0.1",
    "hydra-core==1.3.2",
    "PyDMD>=2025.1.1",
    "einops>=0.7.0",
    "hydra-joblib-launcher==1.2.0",
    "numba>=0.60.0",
    "pandas==2.2.3",
    "tqdm==4.67.1",
    "tabulate>=0.9.0",
    "tjax>=1.0.0",
]
keywords = ["nbdev", "jupyter", "notebook", "python", "jax", "neural networks", "physical modelling"]
authors = [
    { name = "Rodrigo Diaz", email = "r.diazfernandez@qmul.ac.uk" },
    { name = "Carlos de la Vega Martin", email = "c.delavegamartin@qmul.ac.uk" }
]
maintainers = [
    { name = "Rodrigo Diaz", email = "r.diazfernandez@qmul.ac.uk" },
    { name = "Carlos de la Vega Martin", email = "c.delavegamartin@qmul.ac.uk" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English"
]

[project.optional-dependencies]
eval = [
    "soundfile>=0.12.1",
    "itables>=2.2.4",
    "jinja2>=3.1.4",
    "tabulate>=0.9.0",
    "librosa>=0.10.2.post1",
    "scienceplots>=2.1.1",
    "ffmpeg-python>=0.2.0",
]
well = [
    "torch>=2.1", # Installed explicitly to force cpu version
    "the_well==1.0.1",
]


[project.urls]
Homepage = "https://github.com/rodrigodzf/physmodjax"
Documentation = "https://rodrigodzf.github.io/physmodjax"
Source = "https://github.com/rodrigodzf/physmodjax"
Tracker = "https://github.com/rodrigodzf/physmodjax/issues"

[project.scripts]
generate_dataset = "physmodjax.scripts.dataset_generation:generate_dataset"
train_rnn = "physmodjax.scripts.train_rnn:train_rnn"
train_operator = "physmodjax.scripts.train_operator:train_operator"
convert_to_single_file = "physmodjax.scripts.dataset_generation:convert_to_single_file"
create_2d_wave_data = "physmodjax.solver.wave2d_modal:create_2d_wave_data"
get_mean_and_std = "physmodjax.scripts.dataset_generation:get_mean_and_std"
fit_dmd = "physmodjax.utils.linear:fit_dmd"
load_experiment = "physmodjax.utils.parsing:load_experiment"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "physmodjax/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
dev-dependencies = [
    "coverage>=7.6.1",
    "deptry>=0.20.0",
    "ipykernel>=6.29.5",
    "mypy>=1.11.2",
    "nbdev>=2.3.31",
    "quarto-cli>=1.7.30",
    "nbqa>=1.9.0",
    "poethepoet>=0.29.0",
    "pytest>=8.3.3",
    "ruff>=0.6.8",
    "setuptools>=75.2.0",
    # Needed by `nbdev`, but undeclared
]

find-links = ["https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"]

[[tool.uv.index]]
# Only use pytorch for the_well datasets, we don't need cuda support
# This avoids conflicts with jax requirements in the package resolution
name="physmodjax"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "physmodjax" }

[tool.ruff]
line-length = 88
target-version = "py312"
output-format = "concise"  # Works better for CI
# extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PD", "PERF", "UP", "C4"]

[tool.coverage.run]
branch = true
source = ["physmodjax"]

[tool.coverage.report]
show_missing = true

[tool.poe]
verbosity = 0

[tool.poe.tasks]
# Hidden subtasks for Poe. Tasks starting with "_" cannot be executed directly, just used as part of other tasks
# nbdev related tasks
_nb_check_format = "uv run ruff format nbs --check"
_nb_clean = "uv run nbdev_clean"
_nb_format = "uv run ruff format nbs"
_nb_export = "uv run nbdev_export"
_nb_update = "uv run nbdev_update"
_nb_test = { cmd = "uv run nbdev_test", env = { JAX_PLATFORMS = "cpu" } }
_nb_readme = { cmd = "uv run nbdev_readme", env = { JAX_PLATFORMS = "cpu" } }
# Pytest
_pytest = "uv run pytest"
# Linting
_ruff = "uv run ruff check --output-format=concise"
_check_format = "uv run ruff format --diff"
_mypy = "uv run mypy ."
# Formatting
_format = "uv run ruff format"
# UV tasks
_sync = "uv sync --all-extras"
# deptry
_deptry = "uv run deptry ."

[tool.poe.tasks.check]
    help = "Run all the checks for file formatting, linting, typing, and dependency validation"
    sequence = [
        "_nb_check_format",
        "_check_format",
        "_ruff",
        "_deptry",
        "_mypy"
    ]

[tool.poe.tasks.clean]
  help = "Remove temporary files generated during build process"
  cmd  = """
    # multiline commands including comments work too!
    rm -rf .coverage
           .mypy_cache
           .pytest_cache
           ./**/__pycache__
           _proc
           .ruff_cache
  """

[tool.poe.tasks.format]
    help = "Reformat all notebooks and python files"
    sequence = [
        "_nb_format",
        "_format"
    ]

[tool.poe.tasks.sync]
    help = "Full package synchronisation: runs notebook cleaning and formatting, exports library and readme files, regenerates lockfile and update virtual environment"
    sequence = [
        "_nb_clean",
        "_nb_format",
        "_nb_export",
        "_format",
        "_sync",
        "clean"
    ]

[tool.poe.tasks.fullsync]
    help = "Full package synchronisation: runs notebook cleaning and formatting, exports library and readme files, regenerates lockfile and update virtual environment"
    sequence = [
        "_nb_clean",
        "_nb_format",
        "_nb_export",
        "_nb_readme",
        "_format",
        "_sync",
        "clean"
    ]

[tool.poe.tasks.update]
    help = "Update the nbs based on the library"
    sequence = [
        "_nb_clean",
        "_nb_format",
        "_nb_update",
        "_format",
        "_sync",
        "clean"
    ]

[tool.poe.tasks.test]
    help = "Run testsuite, including both notebook tests and pytest"
    sequence = [
        "_nb_test", 
    ]

[tool.poe.tasks.preview]
    help = "Run the preview with quarto"
    cmd = "quarto preview"
    env = { JAX_PLATFORMS = "cpu" }
    cwd = "nbs"

[tool.poe.tasks.publish]
    help = "Publish the documentation with quarto"
    cmd = "quarto publish gh-pages"
    env = { JAX_PLATFORMS = "cpu" }
    cwd = "nbs"
