[DEFAULT]
# Minimal settings config, to let nbdev work alongside standard python tooling

### Python library ###
repo = physmodjax
lib_name = %(repo)s
min_python = 3.10
description = Physical modelling using neural networks with JAX

### nbdev ###
doc_path = _docs
lib_path = physmodjax
nbs_path = nbs
recursive = True
tst_flags = notest
put_version_in_init = True
jupyter_hooks = True

### Docs ###
branch = main
custom_sidebar = False
doc_host = https://%(user)s.github.io
doc_baseurl = /%(repo)s
git_url = https://github.com/%(user)s/%(repo)s
title = %(lib_name)s

### PyPI ###
user = rodrigodzf
copyright = 2023 onwards, %(user)s
